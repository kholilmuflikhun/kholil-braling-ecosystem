name: Prisma Preview Migration

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Type APPLY to run migrations against the Neon Preview branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prisma-preview-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ inputs.confirm_preview == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to Neon Preview
        run: pnpm db:migrate:deploy
