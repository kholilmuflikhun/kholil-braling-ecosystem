name: Bootstrap pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if [ -f pnpm-lock.yaml ] && ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add pnpm workspace lockfile"
            git push origin HEAD:main
          else
            echo "pnpm-lock.yaml is already up to date."
          fi
