name: Prisma Initial Migration Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "prisma.config.ts"
      - ".github/workflows/prisma-migration-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip migration bootstrap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate migration SQL from empty database
        run: |
          mkdir -p prisma/migrations/20261031140000_init
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script --config prisma.config.ts > prisma/migrations/20261031140000_init/migration.sql
          test -s prisma/migrations/20261031140000_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore(db): add initial Prisma migration [skip migration bootstrap]" || exit 0
          git push origin HEAD:main
