name: Ecosystem CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Enable pnpm cache after pnpm-lock.yaml is committed.
      - name: Install
        run: pnpm install --no-frozen-lockfile # Bootstrap only; commit pnpm-lock.yaml before production release
      - name: Persist generated lockfile
        run: |
          if [ -f pnpm-lock.yaml ] && [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add pnpm workspace lockfile"
            git push origin HEAD:main
          fi
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
